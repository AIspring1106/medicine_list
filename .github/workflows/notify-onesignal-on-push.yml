name: Notify PWA subscribers after repository commit

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  notify-subscribers:
    runs-on: ubuntu-latest
    if: ${{ !github.event.deleted }}
    steps:
      - name: Send OneSignal Web Push notification
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ONESIGNAL_APP_ID}" || -z "${ONESIGNAL_REST_API_KEY}" ]]; then
            echo "::warning::OneSignal secrets are missing; no push notification was sent."
            exit 0
          fi

          # APP_URL がGitHub Actions Variablesに登録されていなければ、
          # GitHub PagesのProject Pages URLを owner/repository から自動生成します。
          if [[ -z "${APP_URL}" ]]; then
            OWNER="${GITHUB_REPOSITORY%%/*}"
            REPOSITORY="${GITHUB_REPOSITORY#*/}"
            if [[ "${REPOSITORY}" == "${OWNER}.github.io" ]]; then
              APP_URL="https://${OWNER}.github.io/"
            else
              APP_URL="https://${OWNER}.github.io/${REPOSITORY}/"
            fi
          fi
          APP_URL="${APP_URL%/}/"
          ICON_URL="${APP_URL}icons/icon-192.png"
          BADGE_URL="${APP_URL}icons/notification-badge-96.png"

          SHORT_MESSAGE="${COMMIT_TITLE%%$'\n'*}"
          SHORT_MESSAGE="${SHORT_MESSAGE:0:120}"
          BODY="GitHubにアプリの更新がCommitされました。アプリを開いて更新内容を確認してください。${SHORT_MESSAGE:+ 変更: ${SHORT_MESSAGE}}"
          jq -n \
            --arg app_id "$ONESIGNAL_APP_ID" \
            --arg heading "医薬品リストが更新されました" \
            --arg contents "$BODY" \
            --arg url "$APP_URL" \
            --arg icon "$ICON_URL" \
            --arg badge "$BADGE_URL" \
            '{app_id:$app_id,target_channel:"push",included_segments:["Subscribed Users"],headings:{ja:$heading,en:$heading},contents:{ja:$contents,en:$contents},url:$url,chrome_web_icon:$icon,chrome_web_badge:$badge}' \
            > /tmp/onesignal-payload.json

          curl --fail-with-body --silent --show-error \
            --request POST "https://api.onesignal.com/notifications" \
            --header "Authorization: Key ${ONESIGNAL_REST_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/onesignal-payload.json
